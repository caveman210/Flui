[package]
name = "quote-plugin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quote"
path = "main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
