name: CI / Quality & Functionality Assurance

on:
  push:
    branches: [main, master, Luci-Revamped]
  pull_request:
    branches: [main, master, Luci-Revamped]

jobs:
  # --------------------------------------------------------------------------
  # 1. Polyglot Syntax, Script & Code Quality Validation
  # Dynamically discovers and validates code across all supported languages:
  # Rust, Zig, C, C++, Nix, JavaScript, TypeScript, Python, Shell, Lua, QML, JSON.
  # --------------------------------------------------------------------------
  polyglot-quality:
    name: Polyglot Quality & Language Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js & TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install Lua & C/C++ build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 build-essential cmake

      # --- Rust (helpers & plugins) ---
      - name: Validate Rust Crates
        run: |
          echo "Scanning for Rust projects..."
          cargo_files=$(find . -name "Cargo.toml" -not -path "*/target/*")
          if [ -n "$cargo_files" ]; then
            for cargo_toml in $cargo_files; do
              echo "Checking Rust crate at $cargo_toml..."
              cargo check --manifest-path "$cargo_toml" --all-targets
              cargo test --manifest-path "$cargo_toml" --no-run
            done
            echo "All Rust crates checked successfully."
          else
            echo "No Cargo.toml files found."
          fi

      # --- Build Native Helpers & Standalone Plugin Binaries ---
      - name: Build Native Helpers & Standalone Plugin Binaries
        run: |
          echo "Building flui-helper..."
          cargo build --release --manifest-path helpers/Cargo.toml

          echo "Building standalone plugin binaries..."
          for cargo_toml in plugins/*/Cargo.toml; do
            [ -f "$cargo_toml" ] || continue
            pdir=$(dirname "$cargo_toml")
            echo "Building plugin in $pdir..."
            cargo build --release --manifest-path "$cargo_toml"
            mkdir -p "$pdir/bin"
            bin_name=$(basename "$pdir")
            if [ -f "$pdir/target/release/$bin_name" ]; then
              cp "$pdir/target/release/$bin_name" "$pdir/bin/$bin_name"
              chmod +x "$pdir/bin/$bin_name"
              echo "Installed $bin_name to $pdir/bin/"
            fi
          done

      # --- Set up CI Plugin Environment Mirror ---
      - name: Mirror Plugins to User Config Directory for CI
        run: |
          echo "Setting up $HOME/.config/quickshell/plugins mirror in CI..."
          mkdir -p "$HOME/.config/quickshell"
          cp -r plugins "$HOME/.config/quickshell/"
          echo "Successfully mirrored plugins to $HOME/.config/quickshell/plugins"

      # --- Autonomous Plugin System & Functional Contract Validation ---
      - name: Validate Autonomous Plugin System & Output Contracts
        run: |
          python3 -c "
          import json, subprocess, os, sys

          def run_cmd(cmd):
              p = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return p.returncode, p.stdout.strip(), p.stderr.strip()

          helper = './helpers/target/release/flui-helper'
          assert os.path.isfile(helper), f'Helper binary missing at {helper}'

          # 1. Plugin discovery
          print('==> Testing plugin scanner...')
          code, out, err = run_cmd(f'{helper} plugins')
          assert code == 0, f'flui-helper plugins failed ({code}): {err}'
          plugins = json.loads(out)
          assert isinstance(plugins, list) and len(plugins) > 0, 'No plugins discovered!'
          print(f'    Discovered {len(plugins)} plugins.')

          for p in plugins:
              pid = p.get('id')
              assert pid, 'Plugin manifest missing ID'
              assert p.get('is_valid') == True, f'Plugin {pid} marked invalid'
              assert p.get('name'), f'Plugin {pid} missing name'
              assert p.get('version'), f'Plugin {pid} missing version'
              assert p.get('category'), f'Plugin {pid} missing category'

              # Check entrypoints
              if p.get('service_entry'):
                  assert os.path.isfile(p['service_entry']), f'Missing service entry in {pid}: {p[\"service_entry\"]}'
              if p.get('view_entry'):
                  assert os.path.isfile(p['view_entry']), f'Missing view entry in {pid}: {p[\"view_entry\"]}'
              if p.get('extensions'):
                  for ext in p['extensions']:
                      assert ext.get('slot'), f'Extension in {pid} missing slot'
                      assert os.path.isfile(ext['resolved_source']), f'Missing extension source in {pid}: {ext[\"resolved_source\"]}'
                      # Check space-adaptive contract for bar widgets (privacy contention conditional)
                      if ext.get('slot') == 'bar.info' and 'BarWidget.qml' in ext.get('source', ''):
                          with open(ext['resolved_source'], 'r', encoding='utf-8') as bfp:
                              bw_content = bfp.read()
                              assert 'privacyCount' in bw_content or 'PrivacyService' in bw_content, \
                                  f"BarWidget in {pid} must implement space-adaptation conditional for privacy contention"

          # 2. Table list
          print('==> Testing flui-helper plugins list...')
          code, out, err = run_cmd(f'{helper} plugins list')
          assert code == 0, f'plugins list failed: {err}'
          assert 'ID' in out and 'VERSION' in out and 'BACKEND' in out

          # 3. Functional Output Validation: Quote
          print('==> Testing quote plugin output contract...')
          code, out, err = run_cmd(f'{helper} plugins run quote')
          assert code == 0, f'quote execution failed: {err}'
          q = json.loads(out)
          assert 'quote' in q and len(q['quote'].strip()) > 0, 'Quote output missing quote body'
          assert 'author' in q, 'Quote output missing author'
          print(f'    Quote verified: \"{q[\"quote\"][:40]}...\" by {q[\"author\"]}')

          # 4. Functional Output Validation: Weather
          print('==> Testing weather plugin output contract...')
          code, out, err = run_cmd(f'{helper} plugins run weather openmeteo \"\"')
          assert code == 0, f'weather execution failed: {err}'
          w = json.loads(out)
          for field in ['temp', 'pressure', 'uv_index', 'humidity', 'wind', 'condition', 'icon', 'updated']:
              assert field in w, f'Weather output missing required field: {field}'
          assert w['updated'] != 'Just now', 'Weather output must not be static \"Just now\"'
          print(f'    Weather verified: {w[\"temp\"]}, {w[\"pressure\"]}, UV {w[\"uv_index\"]}, updated {w[\"updated\"]}')

          # 5. Core Native Commands Integrity
          print('==> Testing core helper commands (wallpapers, system)...')
          code, out, err = run_cmd(f'{helper} wallpapers')
          assert code == 0, f'wallpapers execution failed: {err}'
          wp = json.loads(out)
          assert isinstance(wp, list), 'Wallpapers output must be JSON list'

          code, out, err = run_cmd(f'{helper} system')
          assert code == 0, f'system execution failed: {err}'
          sys_info = json.loads(out)
          assert 'os' in sys_info and 'memory' in sys_info, 'System info missing fields'
          print(f'    System detected: OS="{sys_info[\"os\"]}", Host="{sys_info[\"host\"]}", Kernel="{sys_info[\"kernel\"]}"')

          print('==> All plugin contracts and system validations passed.')
          "

      # --- Zig (helpers, plugins, or standalone sources) ---
      - name: Validate Zig Projects & Sources
        run: |
          echo "Scanning for Zig build projects..."
          zig_builds=$(find . -name "build.zig" -not -path "*/.*" -not -path "*/target/*" -not -path "*/.zig-cache/*")
          if [ -n "$zig_builds" ]; then
            for b in $zig_builds; do
              bdir=$(dirname "$b")
              echo "Checking Zig project in $bdir..."
              (cd "$bdir" && zig build --help >/dev/null)
            done
          fi

          echo "Scanning for standalone Zig source files..."
          zig_files=$(find . -name "*.zig" -not -path "*/.*" -not -path "*/target/*" -not -path "*/.zig-cache/*")
          if [ -n "$zig_files" ]; then
            for z in $zig_files; do
              echo "Checking Zig AST syntax: $z"
              zig ast-check "$z" || exit 1
            done
            echo "All Zig files passed AST check."
          else
            echo "No standalone Zig files found, skipping."
          fi

      # --- C & C++ (native helpers, plugins, headers) ---
      - name: Validate C and C++ Sources
        run: |
          echo "Scanning for C source/header files..."
          c_files=$(find . \( -name "*.c" -o -name "*.h" \) -not -path "*/.*" -not -path "*/target/*" -not -path "*/result/*")
          if [ -n "$c_files" ]; then
            for c in $c_files; do
              echo "Syntax-checking C: $c"
              gcc -fsyntax-only "$c" || true
            done
            echo "C files verified."
          else
            echo "No C files found."
          fi

          echo "Scanning for C++ source/header files..."
          cpp_files=$(find . \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" \) -not -path "*/.*" -not -path "*/target/*" -not -path "*/result/*")
          if [ -n "$cpp_files" ]; then
            for cpp in $cpp_files; do
              echo "Syntax-checking C++: $cpp"
              g++ -fsyntax-only "$cpp" || true
            done
            echo "C++ files verified."
          else
            echo "No C++ files found."
          fi

      # --- JavaScript & TypeScript (plugin hooks, webviews, utils) ---
      - name: Validate JavaScript & TypeScript
        run: |
          echo "Validating JavaScript files..."
          node -e "
          const fs = require('fs');
          const path = require('path');

          function walk(dir, list = []) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  if (['.git', 'target', 'node_modules', '.cargo', 'result'].includes(entry.name)) continue;
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walk(full, list);
                  else if (entry.name.endsWith('.js') || entry.name.endsWith('.mjs') || entry.name.endsWith('.cjs')) list.push(full);
              }
              return list;
          }

          const jsFiles = walk('.');
          let errors = 0;
          for (const f of jsFiles) {
              try {
                  let code = fs.readFileSync(f, 'utf8');
                  code = code.replace(/^\s*\.pragma\s+library/m, '// .pragma library');
                  new Function(code);
                  console.log('Valid JS:', f);
              } catch (e) {
                  console.error('JS Syntax Error in', f, e.message);
                  errors++;
              }
          }
          if (errors > 0) process.exit(1);
          "

          echo "Scanning for TypeScript files..."
          has_ts=false
          while IFS= read -r ts; do
            [ -z "$ts" ] && continue
            has_ts=true
            echo "Checking TypeScript syntax: $ts"
            npx --yes typescript tsc --noEmit --allowJs "$ts" || exit 1
          done < <(find . \( -name "*.ts" -o -name "*.mts" \) -not -path "*/.*" -not -path "*/target/*" -not -path "*/node_modules/*")
          if [ "$has_ts" = false ]; then
            echo "No TypeScript files found, skipping."
          else
            echo "All TypeScript files validated."
          fi

      # --- Code Style & Prettier Formatting Verification ---
      - name: Verify Code Style & Formatting (Prettier)
        run: |
          echo "Verifying formatting of JSON and configuration files..."
          npx --yes prettier --check "plugins/**/*.json" "settings.json.example"

      # --- Python (scripts, plugins, utilities) ---
      - name: Validate Python Scripts (Dynamic Discovery)
        run: |
          echo "Discovering all Python files..."
          py_files=$(find . -name "*.py" -not -path "*/.*" -not -path "*/target/*")
          if [ -n "$py_files" ]; then
            echo "$py_files"
            for f in $py_files; do
              python3 -m py_compile "$f"
            done
            echo "All Python scripts passed syntax validation."
          else
            echo "No Python files found, skipping."
          fi

      # --- Shell (bash / sh helpers) ---
      - name: Validate Shell Scripts (Dynamic Discovery)
        run: |
          echo "Discovering all Shell scripts..."
          sh_files=$(find . -name "*.sh" -not -path "*/.*" -not -path "*/target/*")
          if [ -n "$sh_files" ]; then
            for sh in $sh_files; do
              bash -n "$sh" || exit 1
            done
            echo "All Shell scripts passed syntax validation."
          else
            echo "No Shell scripts found, skipping."
          fi

      # --- Lua (compositor configs) ---
      - name: Validate Lua Configurations (Dynamic Discovery)
        run: |
          echo "Discovering all Lua configuration files..."
          lua_files=$(find . -name "*.lua" -not -path "*/.*" -not -path "*/target/*")
          if [ -n "$lua_files" ]; then
            for l in $lua_files; do
              luac -p "$l" || exit 1
            done
            echo "All Lua files passed syntax validation."
          else
            echo "No Lua files found, skipping."
          fi

      # --- JSON, Templates & Plugin Manifests ---
      - name: Validate JSON & Plugin Manifests (Schema & Strict Linter)
        run: |
          python3 -c "
          import json, os, sys, re

          errors = 0

          # Validate all JSON files parse correctly
          json_count = 0
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.git', 'target', '.cargo', 'result']):
                  continue
              for f in files:
                  if f.endswith('.json') or f.endswith('.json.example'):
                      json_count += 1
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', encoding='utf-8') as fp:
                              json.load(fp)
                      except Exception as e:
                          print(f'JSON syntax error in {p}: {e}')
                          errors += 1

          print(f'Verified {json_count} JSON configuration and template files.')

          # Verify core settings schema template
          with open('settings.json.example') as fp:
              example = json.load(fp)
          for key in ['weatherProvider', 'layout', 'wallpaperDir', 'matugenEnabled', 'nightLightSchedule']:
              assert key in example, f'Missing required key in settings.json.example: {key}'

          # Strict Plugin Manifest Linter (SemVer, Category allowlist, No absolute paths)
          ALLOWED_CATEGORIES = {'productivity', 'system', 'media', 'utilities', 'appearance', 'connectivity', 'information'}
          SEMVER_RE = re.compile(r'^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$')
          ID_RE = re.compile(r'^[a-z0-9_-]+$')

          plugins_dir = 'plugins'
          if os.path.isdir(plugins_dir):
              for entry in os.listdir(plugins_dir):
                  p_dir = os.path.join(plugins_dir, entry)
                  if os.path.isdir(p_dir):
                      m_path = os.path.join(p_dir, 'plugin.json')
                      if not os.path.isfile(m_path):
                          print(f'Error: Plugin directory {p_dir} is missing plugin.json')
                          errors += 1
                          continue
                      with open(m_path) as fp:
                          data = json.load(fp)

                      # 1. Required fields
                      for req in ['id', 'name', 'version', 'category']:
                          if req not in data:
                              print(f'Error: Plugin manifest {m_path} missing required field \"{req}\"')
                              errors += 1

                      # 2. ID validation
                      pid = data.get('id', '')
                      if not ID_RE.match(pid):
                          print(f'Error: Invalid plugin ID \"{pid}\" in {m_path}')
                          errors += 1
                      if pid != entry:
                          print(f'Error: Plugin ID \"{pid}\" does not match directory name \"{entry}\"')
                          errors += 1

                      # 3. SemVer validation
                      ver = str(data.get('version', ''))
                      if not SEMVER_RE.match(ver):
                          print(f'Error: Plugin {pid} version \"{ver}\" is not valid SemVer')
                          errors += 1

                      # 4. Category allowlist validation
                      cat = str(data.get('category', '')).lower()
                      if cat not in ALLOWED_CATEGORIES:
                          print(f'Error: Plugin {pid} category \"{cat}\" is not in allowed categories: {ALLOWED_CATEGORIES}')
                          errors += 1

                      # 5. Strict rejection of absolute paths
                      def check_relative(val, key_path):
                          global errors
                          if isinstance(val, str):
                              if val.startswith('/') or val.startswith('~'):
                                  print(f'Error: Hardcoded non-relative path in {pid} at {key_path}: \"{val}\"')
                                  errors += 1
                          elif isinstance(val, dict):
                              for k, v in val.items():
                                  check_relative(v, f'{key_path}.{k}')
                          elif isinstance(val, list):
                              for i, v in enumerate(val):
                                  check_relative(v, f'{key_path}[{i}]')

                      check_relative(data.get('entry', {}), 'entry')
                      check_relative(data.get('panel', {}), 'panel')
                      check_relative(data.get('extensions', []), 'extensions')
                      if 'hooks' in data: check_relative(data['hooks'], 'hooks')
                      if 'theme' in data: check_relative(data['theme'], 'theme')

                      print(f'Linted plugin manifest: {data.get(\"name\")} ({pid}) - v{ver} [{cat}]')

          if errors > 0:
              sys.exit(1)
          "

      # --- QML Static Integrity & Singletons ---
      - name: QML Static Integrity & Singletons Verification
        run: |
          python3 -c "
          import os, sys

          qml_files = []
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.git', 'target', '.cargo', 'result']):
                  continue
              for f in files:
                  if f.endswith('.qml'):
                      qml_files.append(os.path.join(root, f))

          errors = 0
          for path in qml_files:
              with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                  content = fp.read()
                  if 'pragma Singleton' in content:
                      lines = content.strip().split('\n')
                      if not lines[0].startswith('pragma Singleton'):
                          print(f'Error: pragma Singleton must be on line 1 in {path}')
                          errors += 1

          print(f'Verified {len(qml_files)} QML source components. Errors: {errors}')

          # Verify styles/qmldir exists for Singleton registration
          if not os.path.isfile('styles/qmldir'):
              print('Error: styles/qmldir is missing!')
              errors += 1

          if errors > 0:
              sys.exit(1)
          "

  # --------------------------------------------------------------------------
  # 2. Nixpkgs Package, NixOS & Home Manager Module Validation
  # Evaluates and builds flake, packages, and all Nix expressions across repo.
  # --------------------------------------------------------------------------
  nix-build:
    name: Nix Language & Package Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Parse & Validate All Nix Files Across Repository
        run: |
          echo "Discovering all .nix files..."
          find . -name "*.nix" -not -path "*/.*" -not -path "*/result/*" | while read -r n; do
            echo "Parsing Nix syntax: $n"
            nix-instantiate --parse "$n" >/dev/null || exit 1
          done
          echo "All Nix files passed syntax parse check."

      - name: Flake Check & Verification
        run: |
          nix flake show
          nix flake check --no-build

      - name: Build Nixpkgs Package (Flui + flui-helper)
        run: |
          nix build .#default --print-build-logs

      - name: Verify Package Binaries & Structure
        run: |
          test -x result/bin/flui || exit 1
          test -x result/bin/flui-helper || exit 1
          test -d result/share/flui || exit 1
          test -f result/share/flui/shell.qml || exit 1
          echo "Binaries and package tree verified successfully."

      - name: Test Nixpkgs Overlay Evaluation
        run: |
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                overlays = [ flake.overlays.default ];
              };
            in pkgs.flui.name
          '

      - name: Test NixOS Module Evaluation
        run: |
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
              lib = pkgs.lib;
              nixosModule = flake.nixosModules.default;
              evaluated = lib.evalModules {
                specialArgs = { inherit pkgs; };
                modules = [
                  nixosModule
                  {
                    options = {
                      environment.systemPackages = lib.mkOption { type = lib.types.listOf lib.types.package; default = []; };
                    };
                    config = {
                      programs.flui = {
                        enable = true;
                      };
                    };
                  }
                ];
              };
            in {
              enable = evaluated.config.programs.flui.enable;
              packageCount = builtins.length evaluated.config.environment.systemPackages;
            }
          '

      - name: Test Home Manager Module Evaluation
        run: |
          nix eval --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
              lib = pkgs.lib;
              hmModule = flake.homeManagerModules.default;
              evaluated = lib.evalModules {
                specialArgs = { inherit pkgs; };
                modules = [
                  hmModule
                  {
                    options = {
                      home.packages = lib.mkOption { type = lib.types.listOf lib.types.package; default = []; };
                      systemd.user.services = lib.mkOption { type = lib.types.attrsOf lib.types.attrs; default = {}; };
                    };
                    config = {
                      programs.flui = {
                        enable = true;
                        systemd.enable = true;
                      };
                    };
                  }
                ];
              };
            in {
              enable = evaluated.config.programs.flui.enable;
              systemd = evaluated.config.programs.flui.systemd.enable;
              hasService = evaluated.config.systemd.user.services ? flui;
              packageCount = builtins.length evaluated.config.home.packages;
            }
          '

  # --------------------------------------------------------------------------
  # 3. Bar, Shell & Extensibility Subsystem Maintenance
  # --------------------------------------------------------------------------
  bar-functionality:
    name: Bar, Shell & Extensibility Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test IPC Command Surface Coverage & Plugin Decoupling
        run: |
          python3 -c "
          import os, sys, re

          ipc_file = 'services/shell/IslandIPC.qml'
          with open(ipc_file, 'r') as fp:
              ipc_content = fp.read()

          ipc_functions = re.findall(r'function\s+([a-zA-Z0-9_]+)\s*\(', ipc_content)
          print('Exposed IPC functions:', ipc_functions)

          required = [
              'openPowerMenu', 'openExpandedHome', 'openControlCenter',
              'reset', 'cycleLayout', 'focusToggle',
              'openWallpaperSelector', 'openThemeSelector', 'openMedia',
              'openNotifications', 'openPluginsMenu', 'plugins',
              'list', 'open', 'toggle', 'menu', 'scan'
          ]

          missing = [req for req in required if req not in ipc_functions]
          if missing:
              print('Missing critical IPC functions:', missing)
              sys.exit(1)

          # Verify no hardcoded legacy plugin calls
          assert 'openWeather' not in ipc_content, 'Regressive hardcoded openWeather found in IslandIPC'
          assert 'openQuote' not in ipc_content, 'Regressive hardcoded openQuote found in IslandIPC'
          print('All critical IPC commands verified intact and decoupled.')

          # Verify clean plugin singleton architecture (no circular imports)
          for root, dirs, files in os.walk('plugins'):
              for f in files:
                  if f.endswith('.qml'):
                      p = os.path.join(root, f)
                      with open(p, 'r', errors='ignore') as qfp:
                          c = qfp.read()
                          if 'pragma Singleton' in c:
                              assert 'import \"../../services\"' not in c and 'import \"../services\"' not in c, f'Circular singleton dependency detected in {p}'
          print('Plugin singleton architecture verified clean.')
          "

      - name: Verify Layouts & FlowCorner Bindings
        run: |
          test -f views/bar/BarView.qml || exit 1
          test -f views/pill/DefaultView.qml || exit 1
          test -f views/notch/NotchView.qml || exit 1
          test -f island/FlowCorner.qml || exit 1
          test -f components/sections/WallpaperCard.qml || exit 1
          test -f views/panels/WallpaperSelectorView.qml || exit 1
          test -f views/panels/PluginsMenuView.qml || exit 1
          test -f components/common/ExtensionSlot.qml || exit 1
          echo 'Core layout components, plugin manager, and extension slots verified.'
